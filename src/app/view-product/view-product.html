<div class="container">

    <div class="product-card">

        <div class="image-section">
            <img [src]="product.image">

            <div class="badge">
                {{product.category}}
            </div>
        </div>

        <div class="details-section">

            <h1>{{product.name}}</h1>

            <p class="location">
                📍 {{product.location}}
            </p>

            <p class="farmer">
                👨‍🌾 Farmer :
                <strong>{{product.farmer}}</strong>
            </p>

            <h2 class="price">
                ₹ {{product.price}}
                <span>/ {{product.unit}}</span>
            </h2>

            <div class="stock">
                Available :
                <strong>{{product.quantity}}</strong>
            </div>

            <hr>

            <h3>Description</h3>

            <p>
                {{product.description}}
            </p>

            <h3>Specifications</h3>

            <table>

                <tr *ngFor="let item of product.specifications">
                    <td>{{item.name}}</td>
                    <td>{{item.value}}</td>
                </tr>

            </table>

            <div class="quantity">

                <button (click)="decrease()">-</button>

                <input
                    type="number"
                    [(ngModel)]="quantity">

                <button (click)="increase()">+</button>

            </div>

            <div class="buttons">

                <button class="cart"
                    (click)="addToCart()">

                    Add To Cart

                </button>

                <button class="buy"
                    (click)="buyNow()">

                    Buy Now

                </button>

            </div>

        </div>

    </div>

</div>
<app-footer></app-footer>
