  <div class="product-grid">

    @for(product of products;track product.p_id){

    <div class="product-card">

      <div class="image-box">
        <img [src]="product.img1">
      </div>

      <div class="content">

        <h2>{{product.p_name}}</h2>

        <p>{{product.description}}</p>

        <div class="date">
          📅 {{product.DateTime}}
        </div>

        <button >
          Buy Now
        </button>

      </div>

    </div>

    }

  </div>

  

</div>
<app-footer></app-footer>
